<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クレイジー恋愛診断 | Crazy Love Test</title>
<style>
:root{color-scheme:dark;--pink:#ff91c6}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#8d165d 0%,#370c2d 46%,#140713 100%);overflow-x:hidden}
.wrap{max-width:500px;margin:auto;padding:40px 20px 70px;text-align:center}
h1{position:relative;top:25px;font-size:clamp(28px,7vw,39px);margin:15px 0 40px;color:#ffd4e9;text-shadow:0 0 20px #fa2687}
.panel{margin-top:40px;background:linear-gradient(145deg,#5d1648db,#290d29ee);border:1px solid #f765aa88;box-shadow:0 14px 55px #10010f99,inset 0 0 22px #ff4ca318;border-radius:28px;padding:24px 20px}
.modes{display:flex;gap:8px;margin-bottom:25px}
.mode{flex:1;border:1px solid #ff82ba;background:#421134;color:#ffd5e8;border-radius:14px;padding:13px 5px;font-size:13px;font-weight:700;cursor:pointer}
.mode.active{background:linear-gradient(135deg,#ff4fa4,#e31770);border-color:#ffb2d5;box-shadow:0 0 18px #ff4a9b88}
.field{text-align:left;margin:18px 0}
.field label{display:block;color:#ffd2e7;font-weight:700;font-size:14px;margin-bottom:8px}
.field small{font-size:12px;color:#ffa6cc;font-weight:400}
.field input{width:100%;font-size:17px;padding:15px;border-radius:13px;border:1px solid #ff83b8;background:#1e0b20;color:white;outline:none}
.field input:focus{border-color:#fff;box-shadow:0 0 0 3px #fa46985c}
.go{width:100%;margin-top:16px;padding:17px 10px;border:0;border-radius:18px;color:white;font-size:18px;font-weight:800;background:linear-gradient(100deg,#ff60ae,#f31d83,#e0106d);box-shadow:0 8px 28px #fb167b77;cursor:pointer}
.go:active{transform:scale(.98)}
.en{display:block;font-size:12px;font-weight:500;margin-top:5px}
.result{display:none;margin-top:25px;padding:20px 10px;border:1px solid #ff8fc2;border-radius:22px;background:#240c23}
.result.show{display:block;animation:pop .4s ease}
.percent{font-size:clamp(75px,20vw,112px);font-weight:900;line-height:1.2;color:#ff66ad;text-shadow:0 0 16px #ff2b91,0 0 40px #ff2b9166}
.again{margin-top:10px;background:transparent;border:1px solid #ff86bb;border-radius:13px;color:#ffd0e6;padding:11px 23px;font-size:14px;cursor:pointer}
.share{margin-top:20px}
.sharegrid{display:flex;gap:10px}
.sharegrid button{flex:1;background:#66143f;color:white;border:1px solid #f779b2;border-radius:14px;padding:14px 5px;cursor:pointer}
.smallbtn{width:100%;padding:14px 10px;border:0;border-radius:14px;background:linear-gradient(90deg,#ff4ca0,#e90072);color:white;font-weight:800;cursor:pointer;margin-top:10px}
.heart{position:fixed;top:-50px;pointer-events:none;z-index:9;animation:fall linear forwards;text-shadow:0 0 12px #ff70ae}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(550deg);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
#admin{display:none;margin-top:20px;padding:12px;background:#170b18;border:1px solid #a65c85;border-radius:12px;font-size:12px;color:#ffb6d8}
#admin.show{display:block}
#admin button{padding:8px 15px;border:1px solid #ff8dc1;background:#4b1740;color:white;border-radius:8px;margin-top:8px}
.promo{margin:25px 0;text-align:center}
.promo a img{display:block;width:100%;max-width:640px;height:auto;margin:10px auto}
</style>
</head>
<body>
<main class="wrap">
<h1 id="title">Crazy Love Test 💋</h1>
<section class="panel">
  <div class="modes">
    <button type="button" class="mode active" data-mode="love">💕 恋愛相性<span class="en">Love Compatibility</span></button>
    <button type="button" class="mode" data-mode="sex">💋 SEX相性<span class="en">Sexual Compatibility</span></button>
  </div>
  <form id="form">
    <div class="field"><label for="name1">あなたの名前 <small>/ Your Name</small></label><input id="name1" maxlength="40" autocomplete="off" placeholder="名前を入力 / Enter your name" required></div>
    <div class="field"><label for="name2">相手の名前 <small>/ Partner's Name</small></label><input id="name2" maxlength="40" autocomplete="off" placeholder="名前を入力 / Enter their name" required></div>
    <button class="go" type="submit">💗 禁断の相性をチェック 💗<span class="en">Check Your Secret Chemistry</span></button>
  </form>
  <div id="result" class="result" aria-live="polite">
    <div id="percent" class="percent">98%</div>
    <button class="again" id="again" type="button">もう一度診断 / Try Again ↻</button>
    <div class="share">
      <div class="sharegrid">
        <button type="button" data-share="x">𝕏 Xで共有</button>
        <button type="button" data-share="line">LINEで共有</button>
      </div>
      <button class="smallbtn" type="button" data-share="other">♡ その他のアプリで共有</button>
    </div>
  </div>
</section>
<div id="admin">🔒 管理用設定 / Private Settings<br><span id="status"></span><br><button id="toggle" type="button">切り替え / Toggle</button><br><small>この設定はこの端末だけに保存されます。</small></div>
<div class="promo">
  <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fcrazy-love-test.github.io%2F&amp;label=VISITORS&amp;icon=github&amp;color=%23000&amp;message=&amp;style=flat&amp;tz=UTC" alt="Visitors counter">
  <a href="https://550909.com/?f2927217" target="_blank" rel="nofollow sponsored noopener noreferrer"><img src="IMG_1714.jpeg" alt="PR マッチングサービス"></a>
</div>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let mode = 'love';
  let currentPct = null;
  let special = localStorage.getItem('crazy-love-special') !== 'off';

  document.querySelectorAll('.mode').forEach(button => {
    button.addEventListener('click', () => {
      mode = button.dataset.mode;
      document.querySelectorAll('.mode').forEach(item => item.classList.toggle('active', item === button));
      $('result').classList.remove('show');
      currentPct = null;
    });
  });

  function hearts() {
    const icons = ['💗','💕','💖','💘','❤️‍🔥','💋'];
    for (let i = 0; i < 95; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = 14 + Math.random() * 28 + 'px';
      heart.style.animationDuration = 2.5 + Math.random() * 3.5 + 's';
      heart.style.animationDelay = Math.random() * 2 + 's';
      heart.style.setProperty('--drift', Math.random() * 200 - 100 + 'px');
      document.body.append(heart);
      setTimeout(() => heart.remove(), 6500);
    }
  }

  function diagnose() {
    const a = $('name1').value.trim();
    const b = $('name2').value.trim();
    if (!a || !b) { $('form').reportValidity(); return; }
    const isShin = a === 'しんちゃん' || b === 'しんちゃん';
    currentPct = special && isShin ? 100 : Math.floor(Math.random() * 101);
    $('percent').textContent = currentPct + '%';
    $('result').classList.remove('show');
    void $('result').offsetWidth;
    $('result').classList.add('show');
    hearts();
  }

  $('form').addEventListener('submit', event => { event.preventDefault(); diagnose(); });
  $('again').addEventListener('click', diagnose);

  async function shareResult(type) {
    if (currentPct === null) return;
    const url = 'https://crazy-love-test.github.io/';
    const label = mode === 'love' ? '💕 恋愛相性 / Love Compatibility' : '💋 SEX相性 / Sexual Compatibility';
    const message = `💕 Crazy Love Test 💋\n${label}: ${currentPct}%\n${url}`;
    if (type === 'x') {
      window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(message), '_blank', 'noopener');
    } else if (type === 'line') {
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(message), '_blank', 'noopener');
    } else if (navigator.share) {
      try { await navigator.share({title:'Crazy Love Test 💋', text: `${label}: ${currentPct}%`, url}); }
      catch (error) { if (error.name !== 'AbortError') alert('共有できませんでした / Could not share'); }
    } else {
      try { await navigator.clipboard.writeText(message); alert('診断結果をコピーしました！'); }
      catch { prompt('診断結果をコピーしてください', message); }
    }
  }
  document.querySelectorAll('[data-share]').forEach(button => button.addEventListener('click', () => shareResult(button.dataset.share)));

  let taps = 0;
  let last = 0;
  function updateAdmin() { $('status').textContent = 'しんちゃん100%: ' + (special ? 'ON' : 'OFF'); }
  $('title').addEventListener('click', () => {
    if (Date.now() - last > 2500) taps = 0;
    last = Date.now();
    if (++taps >= 7) { $('admin').classList.toggle('show'); taps = 0; updateAdmin(); }
  });
  $('toggle').addEventListener('click', () => {
    special = !special;
    localStorage.setItem('crazy-love-special', special ? 'on' : 'off');
    updateAdmin();
  });
})();
</script>
</body>
</html>
